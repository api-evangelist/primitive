                            - delivered
                            - bounced
                            - deferred
                            - wait_timeout
                          status_changed_at:
                            type: string
                            format: date-time
                            description: 'Timestamp of the most recent status transition.

                              Polling clients should treat `status=''queued''` AND

                              `status_changed_at` older than 5 minutes as

                              "stuck-queued" (the post-tx UPDATE failed and the

                              actual delivery state is recoverable from on-box logs

                              via `queue_id` when populated, or `request_id`).

                              '
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          client_idempotency_key:
                            type:
                            - string
                            - 'null'
                            description: 'Effective idempotency key used for this send. If the

                              caller passed the `Idempotency-Key` header, this is

                              that value; otherwise it''s a server-derived hash of

                              the canonical request payload.

                              '
                          content_hash:
                            type: string
                            description: Stable hash of the canonical send payload.
                          from_header:
                            type: string
                            description: 'Raw `From:` header as sent on the wire, including any

                              display name (e.g. `"Acme Support" <agent@acme.test>`).

                              '
                          from_address:
                            type: string
                            description: Bare email address parsed from `from_header`.
                          to_header:
                            type: string
                            description: 'Raw `To:` header as sent on the wire, including any

                              display name.

                              '
                          to_address:
                            type: string
                            description: Bare email address parsed from `to_header`.
                          subject:
                            type: string
                          body_size_bytes:
                            type: integer
                            description: 'Total UTF-8 byte length of `body_text` + `body_html`.

                              Surfaced on the list endpoint so callers can see "this

                              row has a 4MB body" without fetching it.

                              '
                          content_discarded_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Timestamp at which the bodies were discarded by an

                              entitlement-driven retention policy. Null when bodies

                              are still present. The detail endpoint returns

                              null-valued `body_text`/`body_html` for discarded rows.

                              '
                          message_id:
                            type:
                            - string
                            - 'null'
                            description: 'Wire-level Message-ID assigned to the outbound message

                              (RFC 5322). Null on rows that never reached signing

                              (queued, gate_denied, agent_failed before signing).

                              '
                          in_reply_to:
                            type:
                            - string
                            - 'null'
                            description: 'Wire-level In-Reply-To header value, when this send

                              was a reply.

                              '
                          email_references:
                            type:
                            - string
                            - 'null'
                            description: 'Wire-level References header value, when this send

                              was a reply.

                              '
                          in_reply_to_email_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: 'Reference to the inbound `emails.id` that this send

                              replied to, when known. Populated when the caller used

                              /emails/{id}/reply or when /send-mail''s `in_reply_to`

                              matched a stored inbound message_id in the same org.

                              '
                          thread_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: 'Conversation thread this send belongs to. A reply inherits

                              the thread of the inbound it answers; a fresh send starts a

                              new thread. Fetch `/threads/{thread_id}` for the full

                              ordered thread (inbound + outbound interleaved). NULL on

                              gate-denied sends and on sends created before threading was

                              enabled.

                              '
                          queue_id:
                            type:
                            - string
                            - 'null'
                            description: 'Message identifier assigned by Primitive''s outbound

                              relay once the agent accepts the message. Null on

                              queued, gate_denied, and agent_failed rows.

                              '
                          smtp_response_code:
                            type:
                            - integer
                            - 'null'
                            description: 'Receiver''s 3-digit SMTP code (e.g. 250, 550, 451).

                              Populated on terminal delivery statuses; may be null

                              on a deferred where the agent never got an SMTP-level

                              response (TCP refused, DNS failed, TLS handshake

                              failed). `smtp_response_text` still carries Postfix''s

                              descriptive text in those cases.

                              '
                          smtp_response_text:
                            type:
                            - string
                            - 'null'
                            description: 'Free-form text portion of the receiver''s SMTP

                              response. The most useful debugging signal on a

                              `bounced` or `deferred` row.

                              '
                          smtp_enhanced_status_code:
                            type:
                            - string
                            - 'null'
                            description: 'RFC 3463 enhanced status code (e.g. `5.1.1` for "Bad

                              destination mailbox address"). Distinct from

                              `smtp_response_code`: the basic 3-digit code is coarse

                              (550 = "permanent failure"), the enhanced code is

                              finer-grained.

                              '
                          dkim_selector:
                            type:
                            - string
                            - 'null'
                            description: 'DKIM selector used to sign the outbound message.

                              Public DNS data; useful for diagnosing why a downstream

                              verifier rejected the signature.

                              '
                          dkim_domain:
                            type:
                            - string
                            - 'null'
                            description: DKIM signing domain.
                          error_code:
                            type:
                            - string
                            - 'null'
                            description: 'Stable public error code on `agent_failed` rows. The

                              agent''s internal codes are remapped to a stable public

                              taxonomy (see `publicAgentError` in the server) so this

                              field is safe to branch on across agent versions.

                              '
                          error_message:
                            type:
                            - string
                            - 'null'
                            description: Free-form error message accompanying `error_code`.
                          gates:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  enum:
                                  - send_to_confirmed_domains
                                  - send_to_known_addresses
                                  description: Public recipient-scope gate name that denied the send.
                                reason:
                                  type: string
                                  enum:
                                  - domain_not_confirmed
                                  - recipient_unauthenticated
                                  - recipient_not_known
                                  description: Stable machine-readable denial reason.
                                message:
                                  type: string
                                  description: Human-readable explanation of the gate denial.
                                subject:
                                  type: string
                                  description: Domain or address the gate evaluated.
                                fix:
                                  type: object
                                  properties:
                                    action:
                                      type: string
                                      enum:
                                      - confirm_domain
                                      - sender_must_fix_authentication
                                      - wait_for_inbound
                                      description: Suggested next action for the caller.
                                    subject:
                                      type: string
                                      description: Entity the action applies to.
                                  required:
                                  - action
                                  - subject
                                docs_url:
                                  type: string
                                  description: Public docs URL with more context.
                              required:
                              - name
                              - reason
                              - message
                              - subject
                            description: 'Gate-denial detail on `gate_denied` rows. Mirrors the

                              synchronous /send-mail 403 contract so a caller''s

                              GateDenial handler is the same across live denies and

                              historical lookups. Null on every other status.

                              '
                          request_id:
                            type:
                            - string
                            - 'null'
                            description: 'Server-issued request identifier from the original

                              /send-mail call. Surfaced as the `X-Request-Id`

                              response header on the live send and recorded here

                              for support escalation.

                              '
                        required:
                        - id
                        - status
                        - status_changed_at
                        - created_at
                        - updated_at
                        - content_hash
                        - from_header
                        - from_address
                        - to_header
                        - to_address
                        - subject
                        - body_size_bytes
                      - type: object
                        properties:
                          body_text:
                            type:
                            - string
                            - 'null'
                            description: 'Plain-text body sent on the wire. Null when the

                              send carried only an HTML body, or when bodies have

                              been discarded post-send (`content_discarded_at`

                              set).

                              '
                          body_html:
                            type:
                            - string
                            - 'null'
                            description: 'HTML body sent on the wire. Null when the send

                              carried only a plain-text body, or when bodies

                              have been discarded post-send.

                              '
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
  /send-mail/demo:
    post:
      operationId: sendMailDemo
      summary: Try send-mail without authentication (simulation)
      description: 'Unauthenticated sandbox for `POST /send-mail`. Accepts the same request body, validates it identically, and returns a realistic synthetic success envelope with `demo: true`. **No email is sent, queued, or stored.** Use this to exercise the send flow without credentials; to send real mail, sign up at https://primitive.dev/signup for an API key and call `POST /send-mail` with `Authorization: Bearer prim_<key>`.'
      tags:
      - Sending
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from:
                  type: string
                  minLength: 3
                  maxLength: 998
                  description: RFC 5322 From header. The sender domain must be a verified outbound domain for your organization.
                to:
                  type: string
                  minLength: 3
                  maxLength: 320
                  description: Recipient address. Recipient eligibility depends on your account's outbound entitlements.
                subject:
                  type: string
                  minLength: 1
                  maxLength: 998
                  description: Subject line for the outbound message
                body_text:
                  type: string
                  description: Plain-text message body. At least one of body_text or body_html is required. The combined UTF-8 byte length of body_text and body_html must be at most 262144 bytes.
                body_html:
                  type: string
                  description: HTML message body. At least one of body_text or body_html is required. The combined UTF-8 byte length of body_text and body_html must be at most 262144 bytes.
                in_reply_to:
                  type: string
                  minLength: 1
                  maxLength: 998
                  pattern: ^[^\x00-\x1F\x7F]+$
                  description: Message-ID of the direct parent email when sending a threaded reply.
                references:
                  type: array
                  maxItems: 100
                  description: Full ordered message-id chain for the thread.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 998
                    pattern: ^[^\x00-\x1F\x7F]+$
                attachments:
                  type: array
                  maxItems: 100
                  description: Inline attachments. Send requests with attachments to https://api.primitive.dev/v1/send-mail. Combined raw decoded attachment bytes must be at most 31457280.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      filename:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Attachment filename. Control characters are rejected.
                      content_type:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Optional MIME content type. Control characters are rejected.
                      content_base64:
                        type: string
                        minLength: 1
                        maxLength: 44040192
                        description: Base64-encoded attachment bytes.
                    required:
                    - filename
                    - content_base64
                wait:
                  type: boolean
                  description: When true, wait for the first downstream SMTP delivery outcome before returning.
                wait_timeout_ms:
                  type: integer
                  minimum: 1000
                  maximum: 30000
                  description: Maximum time to wait for a delivery outcome when wait is true. Defaults to 30000.
              required:
              - from
              - to
              - subject
            example:
              from: agent@your-subdomain.primitive.email
              to: someone@example.com
              subject: Hello from my agent
              body_text: This is a test send via the public demo endpoint.
      responses:
        '200':
          description: Simulated send accepted. Identical shape to a fresh asynchronous /send-mail response, plus a top-level `demo` flag. No mail was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  demo:
                    type: boolean
                    const: true
                  note:
                    type: string
                    description: Human-readable reminder that the response is simulated.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Persisted sent-email attempt ID.
                      status:
                        type: string
                        description: "Lifecycle status of a sent_emails row. Possible values:\n\n  - `queued`: pre-call INSERT; the outbound agent has not\n    yet replied.\n  - `submitted_to_agent`: agent accepted; `queue_id` is set.\n  - `agent_failed`: agent rejected; `error_code` and\n    `error_message` carry the reason.\n  - `gate_denied`: a recipient-scope gate denied the send;\n    the agent was never called. The `gates` array carries\n    the denial detail. /send-mail returns 403 in this case\n    so callers see the denial synchronously; /sent-emails\n    additionally records the row for historical lookup,\n    which is when this status appears in a listing.\n  - `unknown`: terminal indeterminate; the on-box log\n    poller couldn't classify the receiver's response.\n  - `delivered` / `bounced` / `deferred` / `wait_timeout`:\n    terminal delivery outcomes (see DeliveryStatus).\n"
                        enum:
                        - queued
                        - submitted_to_agent
                        - agent_failed
                        - gate_denied
                        - unknown
                        - delivered
                        - bounced
                        - deferred
                        - wait_timeout
                      from:
                        type: string
                        description: 'Bare from-address actually written on the wire. Echoed

                          on every success branch so callers can confirm what

                          went out, particularly useful for the /emails/{id}/reply

                          path where `from` is server-derived from the inbound''s

                          recipient when the caller doesn''t override.


                          For sends where the caller passed a from-header that

                          included a display name (e.g. `"Acme Support" <support@acme.test>`),

                          this field is the parsed bare address (`support@acme.test`).

                          The display name was sent on the wire intact; this field

                          just makes the address easy to compare against allowlists.

                          '
                      queue_id:
                        type:
                        - string
                        - 'null'
                        description: 'Message identifier assigned by Primitive''s OUTBOUND relay

                          (the box that signs your mail and submits it to the

                          receiving MTA). NOT the receiver''s queue id.


                          The receiver may also report its own queue id in

                          `smtp_response_text` (e.g. `"250 2.0.0 Ok: queued as

                          99D111927CDA"` from a Postfix receiver). Those two ids

                          refer to different mail systems and are NOT comparable.

                          Treat `queue_id` as Primitive-internal and the

                          receiver''s id as remote-system-internal.


                          Null on rows that never reached the relay (queued,

                          gate_denied, agent_failed before signing).

                          '
                      accepted:
                        type: array
                        items:
                          type: string
                        description: Recipient addresses accepted by the relay.
                      rejected:
                        type: array
                        items:
                          type: string
                        description: Recipient addresses rejected by the relay.
                      client_idempotency_key:
                        type: string
                        description: Effective idempotency key used for this send.
                      request_id:
                        type: string
                        description: Server-issued request identifier for support and tracing.
                      content_hash:
                        type: string
                        description: Stable hash of the canonical send payload.
                      delivery_status:
                        type: string
                        description: 'Narrower enum covering only the four terminal delivery

                          outcomes returned to a synchronous `wait: true` send.


                          On the SendMailResult shape, `delivery_status` is always

                          equal to `status` whenever both are present (i.e. on

                          terminal-state replays and live wait=true responses).

                          The two fields exist so callers that want to type-narrow

                          on "this is a delivery outcome" can pattern-match against

                          the four-value enum without handling the broader

                          SentEmailStatus value set (which also covers `queued`,

                          `submitted_to_agent`, `agent_failed`, `gate_denied`,

                          `unknown`).


                          On async-mode and pre-terminal responses, `delivery_status`

                          is absent and only `status` is populated. Use `status` if

                          you want a single field that''s always present.

                          '
                        enum:
                        - delivered
                        - bounced
                        - deferred
                        - wait_timeout
                      smtp_response_code:
                        type:
                        - integer
                        - 'null'
                        description: SMTP response code from the first downstream delivery outcome when wait is true.
                      smtp_response_text:
                        type: string
                        description: SMTP response text from the first downstream delivery outcome when wait is true.
                      idempotent_replay:
                        type: boolean
                        description: 'True when the response replays a previously-recorded send

                          keyed by `client_idempotency_key` (same key, same canonical

                          payload). False on a fresh send and on gate-denied

                          responses. Lets callers branch on cache state without

                          diffing fields.

                          '
                    required:
                    - id
                    - status
                    - from
                    - queue_id
                    - accepted
                    - rejected
                    - client_idempotency_key
                    - request_id
                    - content_hash
                    - idempotent_replay
                required:
                - success
                - demo
                - data
              example:
                success: true
                demo: true
                note: 'Simulated response. No email was sent. Sign up at https://primitive.dev/signup for an API key, then POST the same body to /v1/send-mail with Authorization: Bearer prim_<key>.'
                data:
                  id: 3f1c0a9e-2b7d-4e5a-9c6f-8d2e1a4b5c6d
                  status: queued
                  from: agent@your-subdomain.primitive.email
                  queue_id: demo_9a3f1c0a
                  accepted:
                  - someone@example.com
                  rejected: []
                  client_idempotency_key: null
                  request_id: 7b2e4d6a-1c3f-4a5b-8d9e-0f1a2b3c4d5e
                  content_hash: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
                  idempotent_replay: false
                  dedup_reason: null
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: Request body exceeds the demo size cap.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
          description: Content-Type must be application/json.
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Demo rate limit reached.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
