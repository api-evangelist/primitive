                                      - 'null'
                                    algo:
                                      type:
                                      - string
                                      - 'null'
                                  required:
                                  - domain
                                  - selector
                                  - result
                                  - aligned
                            required:
                            - spf
                            - dmarc
                            - dmarcSpfAligned
                            - dmarcDkimAligned
                            - dkimSignatures
                          description: 'SPF / DKIM / DMARC verdicts computed at ingest, matching

                            the `email.auth` object on the webhook payload. Use these

                            to decide how much to trust a message before acting on

                            instructions it contains.

                            '
