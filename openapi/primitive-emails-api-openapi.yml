                                      type:
                                      - string
                                      - 'null'
                                    content_type:
                                      type:
                                      - string
                                      - 'null'
                                    size_bytes:
                                      type: integer
                                    sha256:
                                      type:
                                      - string
                                      - 'null'
                                    part_index:
                                      type: integer
                                      description: Zero-based index of this part within the message.
                                  required:
                                  - size_bytes
                                description: Attachment metadata. Empty array when none.
                              error:
                                type:
                                - object
                                - 'null'
                                description: 'Present (non-null) only when `status` is `failed`. When

                                  present, all three fields are populated, so a consumer can

                                  branch on `code` without defensive null checks.

