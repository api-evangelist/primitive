  /emails/{id}/replay:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    post:
      operationId: replayEmailWebhooks
      summary: Replay email webhooks
      description: 'Re-delivers the webhook payload for this email to all active

        endpoints matching the email''s domain. Rate limited per-email

        (short cooldown between successive replays of the same email)

        and per-org (burst + sustained windows), sharing an org-wide

        budget with delivery replays.

        '
      tags:
      - Emails
      responses:
        '200':
          description: Replay result
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        delivered:
                          type: integer
                          description: Number of successful deliveries
                        failed:
                          type: integer
                          description: Number of failed deliveries
                      required:
                      - delivered
                      - failed
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /emails/{id}/discard-content:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    post:
      operationId: discardEmailContent
      summary: Discard email content
      description: 'Permanently deletes the email''s raw bytes, parsed body (text + HTML),

        and attachments while preserving metadata (sender, recipient,

        subject, timestamps, hashes, attachment manifest) for audit logs.

        Idempotent: a second call returns success with

        `already_discarded: true` and does no work.


        **Gated** on the customer''s discard-content opt-in (managed in the

        dashboard at Settings > Webhooks). When the toggle is off, this

        endpoint returns `403` with code `discard_not_enabled` and a

        message pointing the human at the dashboard. There is intentionally

        no API to flip this toggle. Opting in to a destructive,

        non-reversible operation must be a deliberate human click in the

        UI.

        '
      tags:
      - Emails
      responses:
        '200':
          description: Discard result
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        discarded:
                          type: boolean
                          description: 'Always `true` on a 2xx response. The content is either now

                            discarded as a result of this call, or was already discarded

                            before this call ran.

                            '
                        already_discarded:
                          type: boolean
                          description: '`true` if the email''s content was already discarded before

                            this call ran (no work was done). `false` if this call was

                            the one that performed the discard.

                            '
                      required:
                      - discarded
                      - already_discarded
                  required:
                  - data
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
        '500':
          $ref: '#/components/responses/InternalError'
          description: Primitive encountered an internal error
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /emails/{id}/conversation:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    get:
      operationId: getConversation
      summary: Get the conversation an email belongs to
      description: 'Returns the full conversation the given inbound email belongs

        to, as ordered, ready-to-prompt turns WITH bodies. It resolves

        the thread from the email and returns every message oldest-first,

        so an agent that received an email can pass `messages` straight

        to a chat model in one call instead of walking `/threads/{id}`

        plus `/emails/{id}` and `/sent-emails/{id}` per message.


        Each message carries a `direction` (`inbound` | `outbound`) and a

        derived `role`: `inbound` -> `user`, `outbound` -> `assistant`

        (your own prior replies). The role mapping assumes the caller

        owns the outbound side, which is the agent-reply case this exists

        for. If the email has no thread yet (a brand-new message), the

        conversation is just that one message as a single user turn.


        The message list is capped; check `truncated` to detect when

        older messages were omitted. Consecutive same-role turns are not

        merged here; that normalization is model-specific and left to the

        caller.

        '
      tags:
      - Emails
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: 'The full conversation an inbound email belongs to, as ordered,

                        ready-to-prompt turns with bodies. Resolves the thread from the

                        email and returns every message oldest-first, so an agent that

                        received an email can pass `messages` straight to a chat model in

                        one call.

                        '
                      properties:
                        thread_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: 'The thread this email belongs to, or null when the email

                            isn''t threaded yet (the conversation is then just this one

                            message).

                            '
                        subject:
                          type:
                          - string
                          - 'null'
                          description: 'Normalized thread subject (Re/Fwd prefixes stripped), or the

                            email''s own subject when it isn''t threaded.

                            '
                        message_count:
                          type: integer
                          description: 'Total messages in the thread. `messages` is capped, so

                            `truncated` is true (and this can exceed `messages.length`)

                            when older messages were omitted.

                            '
                        truncated:
                          type: boolean
                          description: 'True when `messages` omits part of the conversation because

                            the thread exceeds the per-call cap.

                            '
                        messages:
                          type: array
                          items:
                            type: object
                            description: One message in the conversation, with its body and a chat role.
                            properties:
                              role:
                                type: string
                                enum:
                                - user
                                - assistant
                                description: 'Chat role derived from `direction`: `user` for inbound

                                  (received) messages, `assistant` for outbound (your own prior

                                  replies). Lets `messages` be passed directly to a chat model.

                                  '
                              direction:
                                type: string
                                enum:
                                - inbound
                                - outbound
                                description: '`inbound` for a received email (`/emails/{id}`), `outbound`

                                  for a send (`/sent-emails/{id}`).

                                  '
                              id:
                                type: string
                                format: uuid
                              message_id:
                                type:
                                - string
                                - 'null'
                              from:
                                type:
                                - string
                                - 'null'
                              to:
                                type:
                                - string
                                - 'null'
                              subject:
                                type:
                                - string
                                - 'null'
                              text:
                                type: string
                                description: 'Plain-text body. Empty string when the message has no text

                                  part or its content was discarded by retention.

                                  '
                              timestamp:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: received_at for inbound, created_at for outbound.
                            required:
                            - role
                            - direction
                            - id
                            - text
                      required:
                      - thread_id
                      - message_count
                      - truncated
                      - messages
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
components:
  responses:
    InternalError:
      description: Primitive encountered an internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: internal_error
              message: Internal server error
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: unauthorized
              message: Invalid or missing API key
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: not_found
              message: Resource not found
    Forbidden:
      description: Authenticated caller lacks permission for the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: forbidden
              message: Insufficient permissions
    GatewayTimeout:
      description: Primitive timed out while waiting for a downstream operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: internal_error
              message: Downstream operation timed out
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: validation_error
              message: Invalid domain format
  schemas:
    GateDenial:
      type: object
      properties:
        name:
          type: string
          enum:
          - send_to_confirmed_domains
          - send_to_known_addresses
          description: Public recipient-scope gate name that denied the send.
        reason:
          type: string
          enum:
          - domain_not_confirmed
          - recipient_unauthenticated
          - recipient_not_known
          description: Stable machine-readable denial reason.
        message:
          type: string
          description: Human-readable explanation of the gate denial.
        subject:
          type: string
          description: Domain or address the gate evaluated.
        fix:
          $ref: '#/components/schemas/GateFix'
        docs_url:
          type: string
          description: Public docs URL with more context.
      required:
      - name
      - reason
      - message
      - subject
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - not_found
              - validation_error
              - rate_limit_exceeded
              - internal_error
              - conflict
              - mx_conflict
              - outbound_disabled
              - cannot_send_from_domain
              - recipient_not_allowed
              - outbound_key_missing
              - outbound_unreachable
              - outbound_key_invalid
              - outbound_capacity_exhausted
              - outbound_response_malformed
              - outbound_relay_failed
              - discard_not_enabled
              - inbound_not_repliable
              - search_timeout
              - authorization_pending
              - slow_down
              - access_denied
              - expired_token
              - invalid_device_code
              - invalid_signup_code
              - invalid_signup_token
              - invalid_verification_code
              - email_delivery_failed
              - clerk_signup_failed
              - no_orgs_for_user
              - org_not_accessible
              - feature_disabled
              - memory_conflict
              - developer_usage_credit_exhausted
              - no_payout_address
              - ownership_proof_failed
              - payment_verification_failed
              - payment_declined
              - challenge_expired
              - settlement_failed
              - template_not_installable
              - scaffold_only
              - invalid_variables
              - unknown_secrets
              - missing_secrets
              - no_inbound_domain
              - domain_cannot_send
              - address_taken
              - route_cap_reached
              - name_exhausted
            message:
              type: string
            details:
              type: object
              description: 'Optional structured data that callers can inspect to recover

                from the error. The fields present depend on `code`. Additional

                keys may be added over time without a major-version bump.

                '
              additionalProperties: true
              properties:
                mx_conflict:
                  type: object
                  description: Present when `code == mx_conflict`.
                  required:
                  - provider_name
                  - suggested_subdomain
                  properties:
                    provider_name:
                      type: string
                      description: Human-readable name of the detected mailbox provider (e.g. "Google Workspace").
                    suggested_subdomain:
                      type: string
                      description: Subdomain to try instead (e.g. "mail" for `mail.example.com`).
                required_entitlements:
                  type: array
                  items:
                    type: string
                  description: Entitlements that would allow a denied send when no recipient-scope gate was granted.
                sent_email_id:
                  type: string
                  description: ID of the persisted sent-email attempt associated with the error.
                content_hash:
                  type: string
                  description: Content hash of the original request on idempotency cache-hit errors.
                client_idempotency_key:
                  type: string
                  description: Effective idempotency key associated with the original request.
            gates:
              type: array
              items:
                $ref: '#/components/schemas/GateDenial'
              description: Structured per-gate denial detail for recipient-scope send-mail failures.
            request_id:
              type: string
              description: Server-issued request identifier for support and tracing.
          required:
          - code
          - message
      required:
      - success
      - error
    GateFix:
      type: object
      properties:
        action:
          type: string
          enum:
          - confirm_domain
          - sender_must_fix_authentication
          - wait_for_inbound
          description: Suggested next action for the caller.
        subject:
          type: string
          description: Entity the action applies to.
      required:
      - action
      - subject
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key with `prim_` prefix or OAuth access token with `prim_oat_` prefix: `Authorization: Bearer <token>`. Access is governed by the caller''s organization role (`owner`, `admin`, or `member`): API keys always act at `member` level regardless of who created them, and OAuth access tokens act with the authorizing user''s current organization role, resolved per request. Every operation in this spec is available to organization members; billing and organization administration are owner/admin actions performed in the dashboard and are not part of this API.'
    DownloadToken:
      type: apiKey
      in: query
      name: token
      description: Signed download token provided in webhook payloads
