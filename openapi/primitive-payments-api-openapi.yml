                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: 'The payer''s outbound spend policy. Returned with defaults (not paused,

                        no caps, any on-net payee) when none is set.

                        '
                      properties:
                        paused:
                          type: boolean
                          description: Kill-switch. When true, all outbound payments are refused.
                        max_per_payment:
                          type:
