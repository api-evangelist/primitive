  /x402/challenges/{id}/pay:
    post:
      operationId: payChallenge
      summary: Pay a payment challenge
      description: 'Settle a challenge addressed to your org as payer. The request body

        carries a signed x402 `PaymentPayload`: an EIP-3009

        `transferWithAuthorization` signed locally with your own key, whose nonce

        is bound to the challenge via the SDK''s `deriveEip3009Nonce`. The platform

        verifies every signed field against its own record of the challenge,

        applies your spend policy, and settles on-chain through a facilitator.

        Settlement is non-custodial; Primitive never holds funds. Idempotent:

        paying an already-settled challenge returns the original receipt. Most

        callers use the SDK `pay()` helper rather than building the payload by

        hand.

        '
      tags:
      - Payments
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource UUID
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payment:
                  type: object
                  description: 'A signed x402 v1 `PaymentPayload`. The SDK `pay()` helper builds this;

                    callers rarely construct it by hand. Field names are x402-native.

                    '
                  properties:
                    x402Version:
                      type: integer
                      const: 1
                    scheme:
                      type: string
                      const: exact
                    network:
                      type: string
                      enum:
                      - base
                      - base-sepolia
                    payload:
                      type: object
                      properties:
                        signature:
                          type: string
                          pattern: ^0x[0-9a-fA-F]+$
                          description: The EIP-712 signature over the authorization.
                        authorization:
                          type: object
                          description: The EIP-3009 `transferWithAuthorization` fields, as strings.
                          properties:
                            from:
                              type: string
                            to:
                              type: string
                            value:
                              type: string
                            validAfter:
                              type: string
                            validBefore:
                              type: string
                            nonce:
                              type: string
                          required:
                          - from
                          - to
                          - value
                          - validAfter
                          - validBefore
                          - nonce
                      required:
                      - signature
                      - authorization
                  required:
                  - x402Version
                  - scheme
                  - network
                  - payload
              required:
              - payment
      responses:
        '200':
          description: Challenge settled (or already settled)
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum:
                          - settled
                        settle_tx:
                          type:
                          - string
                          - 'null'
                          description: On-chain settlement transaction hash.
                      required:
                      - id
                      - status
                      - settle_tx
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
