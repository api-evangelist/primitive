                        enum:
                        - domain
                      domainId:
                        type: string
                        format: uuid
                    required:
                    - kind
                    - domainId
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - fallback
                    required:
                    - kind
