      - Functions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Target for a route binding. Either a specific verified domain

                (scoped) or the org-wide fallback. Pass `takeover: true` to

                deactivate any conflicting binding before installing this one.

                '
