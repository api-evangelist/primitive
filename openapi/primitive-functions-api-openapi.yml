  /functions/routing-topology:
    get:
      operationId: getOrgRoutingTopology
      summary: Get the org's function routing topology
      description: 'Returns a single snapshot of how inbound mail is routed across

        this org''s active domains and functions: which active domain has

        which function bound, the org''s fallback function (if any), and

        every deployed function with no route bound. Use this to answer

        "which of my functions actually receive mail?" diagnostically.

        '
      tags:
      - Functions
      responses:
        '200':
          description: Routing topology
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: 'Org-wide map of function routing: which domain points at which

                        function, the org''s fallback binding (if any), and every

                        deployed function with no route currently bound.

                        '
                      properties:
                        domains:
                          type: array
                          items:
                            type: object
                            properties:
                              domain_id:
                                type: string
                                format: uuid
                              domain:
                                type: string
                              routed_function:
                                type:
                                - object
                                - 'null'
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  name:
                                    type: string
                                required:
                                - id
                                - name
                              endpoint_enabled:
                                type:
                                - boolean
                                - 'null'
                            required:
                            - domain_id
                            - domain
                            - routed_function
                            - endpoint_enabled
