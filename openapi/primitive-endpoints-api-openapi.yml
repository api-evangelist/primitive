openapi: 3.2.0
info:
  title: Primitive Endpoints API
  version: 1.0.0
  description: Primitive is email infrastructure for AI agents.
  contact:
    name: Primitive
    url: https://primitive.dev
  license:
    name: Proprietary
    url: https://primitive.dev/terms
  x-stability-level: stable
  x-deprecation-policy: 'Breaking changes are announced at least 6 months in advance. Deprecated fields carry x-deprecated: true. The current stable version is v1.'
servers:
- url: https://api.primitive.dev/v1
  description: Canonical API host (PRIMITIVE_API_BASE_URL). Carries every public API operation.
tags:
- name: Endpoints
  description: Manage webhook endpoints that receive email events
paths:
  /endpoints:
    get:
      operationId: listEndpoints
      summary: List webhook endpoints
      description: Returns all active (non-deleted) webhook endpoints.
      tags:
      - Endpoints
      responses:
        '200':
          description: List of endpoints
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          org_id:
                            type: string
                            format: uuid
                          url:
                            type:
                            - string
                            - 'null'
                          enabled:
                            type: boolean
                          domain_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: Restrict this endpoint to emails from a specific domain
                          rules:
                            type: object
                            description: Endpoint-specific filtering rules
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          delivery_count:
                            type: integer
                            description: Total webhook deliveries attempted
                          success_count:
                            type: integer
                            description: Successful deliveries
                          failure_count:
                            type: integer
                            description: Failed deliveries
                          consecutive_fails:
                            type: integer
                            description: Current streak of consecutive failures
                          last_delivery_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          last_success_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          last_failure_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          deactivated_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          kind:
                            type: string
                            enum:
                            - http
                            - function
                            description: 'http: deliver to the webhook URL. function: invoke a Primitive Function.'
                          function_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: The Function this endpoint invokes, when kind is function.
                          is_route_target:
                            type: boolean
                            description: 'When true, this endpoint is reachable only via an explicit recipient

                              route, never as a domain''s default destination, and is exempt from

                              the one-endpoint-per-domain rule (so many can share a domain).

                              '
                        required:
                        - id
                        - org_id
                        - enabled
                        - rules
                        - created_at
                        - updated_at
                        - delivery_count
                        - success_count
                        - failure_count
                        - consecutive_fails
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
    post:
      operationId: createEndpoint
      summary: Create a webhook endpoint
      description: 'Creates a new webhook endpoint. If a deactivated endpoint

        with the same URL and domain exists, it is reactivated

        instead. Subject to plan limits on the number of active

        endpoints.


        **Signing is account-scoped, not per-endpoint.** This call

        does not return any signing material; every endpoint on the

        account uses the same webhook secret, fetched via

        `GET /account/webhook-secret`. See the API-level "Webhook

        signing" section for the full wire format (header name,

        signed string, hash algo, secret format, tolerance) and a

        language-agnostic verification recipe.


        After creating the endpoint, fire a test delivery against

        it via `POST /endpoints/{id}/test` to confirm your verifier

        accepts the signature.'
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                  - http
                  - function
                  default: http
                  description: 'http: deliver to a webhook URL (provide url). function: invoke a Primitive Function (provide function_id, omit url).'
                url:
                  type: string
                  minLength: 1
                  description: The webhook URL to deliver events to. Required when kind is http; omit for function endpoints.
                function_id:
                  type: string
                  format: uuid
                  description: The Function to invoke. Required when kind is function.
                enabled:
                  type: boolean
                  default: true
                  description: Whether the endpoint is active
                domain_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Restrict to emails from a specific domain
                rules:
                  type: object
                  description: Endpoint-specific filtering rules
                is_route_target:
                  type: boolean
                  default: false
                  description: 'Create this endpoint as a route-target: reachable only via an

                    explicit recipient route, never a domain''s default destination, and

                    exempt from the one-endpoint-per-domain rule.

                    '
      responses:
        '201':
          description: Endpoint created (or reactivated)
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        url:
                          type:
                          - string
                          - 'null'
                        enabled:
                          type: boolean
                        domain_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Restrict this endpoint to emails from a specific domain
                        rules:
                          type: object
                          description: Endpoint-specific filtering rules
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        delivery_count:
                          type: integer
                          description: Total webhook deliveries attempted
                        success_count:
                          type: integer
                          description: Successful deliveries
                        failure_count:
                          type: integer
                          description: Failed deliveries
                        consecutive_fails:
                          type: integer
                          description: Current streak of consecutive failures
                        last_delivery_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        last_success_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        last_failure_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        deactivated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        kind:
                          type: string
                          enum:
                          - http
                          - function
                          description: 'http: deliver to the webhook URL. function: invoke a Primitive Function.'
                        function_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: The Function this endpoint invokes, when kind is function.
                        is_route_target:
                          type: boolean
                          description: 'When true, this endpoint is reachable only via an explicit recipient

                            route, never as a domain''s default destination, and is exempt from

                            the one-endpoint-per-domain rule (so many can share a domain).

                            '
                      required:
                      - id
                      - org_id
                      - enabled
                      - rules
                      - created_at
                      - updated_at
                      - delivery_count
                      - success_count
                      - failure_count
                      - consecutive_fails
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /endpoints/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    patch:
      operationId: updateEndpoint
      summary: Update a webhook endpoint
      description: 'Updates an active webhook endpoint. If the URL is changed, the old

        endpoint is deactivated and a new one is created (or an existing

        deactivated endpoint with the new URL is reactivated).'
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
                  minLength: 1
                  description: New webhook URL (triggers endpoint rotation)
                enabled:
                  type: boolean
                domain_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                rules:
                  type: object
              minProperties: 1
      responses:
        '200':
          description: Updated endpoint
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        url:
                          type:
                          - string
                          - 'null'
                        enabled:
                          type: boolean
                        domain_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Restrict this endpoint to emails from a specific domain
                        rules:
                          type: object
                          description: Endpoint-specific filtering rules
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        delivery_count:
                          type: integer
                          description: Total webhook deliveries attempted
                        success_count:
                          type: integer
                          description: Successful deliveries
                        failure_count:
                          type: integer
                          description: Failed deliveries
                        consecutive_fails:
                          type: integer
                          description: Current streak of consecutive failures
                        last_delivery_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        last_success_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        last_failure_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        deactivated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        kind:
                          type: string
                          enum:
                          - http
                          - function
                          description: 'http: deliver to the webhook URL. function: invoke a Primitive Function.'
                        function_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: The Function this endpoint invokes, when kind is function.
                        is_route_target:
                          type: boolean
                          description: 'When true, this endpoint is reachable only via an explicit recipient

                            route, never as a domain''s default destination, and is exempt from

                            the one-endpoint-per-domain rule (so many can share a domain).

                            '
                      required:
                      - id
                      - org_id
                      - enabled
                      - rules
                      - created_at
                      - updated_at
                      - delivery_count
                      - success_count
                      - failure_count
                      - consecutive_fails
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
    delete:
      operationId: deleteEndpoint
      summary: Delete a webhook endpoint
      description: Delete a webhook endpoint. Inbound messages are no longer delivered to it.
      tags:
      - Endpoints
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: boolean
                          const: true
                      required:
                      - deleted
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
  /endpoints/{id}/test:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    post:
      operationId: testEndpoint
      summary: Send a test webhook
      description: 'Sends a sample `email.received` event to the endpoint. The request

        includes SSRF protection (private IP rejection and DNS pinning).

        Rate limited to 4 per minute and 30 per hour (non-exempt).

        Successful deliveries and verified-domain endpoints are exempt

        from the rate limit.'
      tags:
      - Endpoints
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: integer
                          description: HTTP status code returned by the endpoint
                        body:
                          type: string
                          description: Response body (truncated to 1000 characters)
                        signature:
                          type: string
                          description: The signature header value sent (if webhook secret is configured)
                      required:
                      - status
                      - body
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: not_found
              message: Resource not found
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: unauthorized
              message: Invalid or missing API key
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: validation_error
              message: Invalid domain format
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - not_found
              - validation_error
              - rate_limit_exceeded
              - internal_error
              - conflict
              - mx_conflict
              - outbound_disabled
              - cannot_send_from_domain
              - recipient_not_allowed
              - outbound_key_missing
              - outbound_unreachable
              - outbound_key_invalid
              - outbound_capacity_exhausted
              - outbound_response_malformed
              - outbound_relay_failed
              - discard_not_enabled
              - inbound_not_repliable
              - search_timeout
              - authorization_pending
              - slow_down
              - access_denied
              - expired_token
              - invalid_device_code
              - invalid_signup_code
              - invalid_signup_token
              - invalid_verification_code
              - email_delivery_failed
              - clerk_signup_failed
              - no_orgs_for_user
              - org_not_accessible
              - feature_disabled
              - memory_conflict
              - developer_usage_credit_exhausted
              - no_payout_address
              - ownership_proof_failed
              - payment_verification_failed
              - payment_declined
              - challenge_expired
              - settlement_failed
              - template_not_installable
              - scaffold_only
              - invalid_variables
              - unknown_secrets
              - missing_secrets
              - no_inbound_domain
              - domain_cannot_send
              - address_taken
              - route_cap_reached
              - name_exhausted
            message:
              type: string
            details:
              type: object
              description: 'Optional structured data that callers can inspect to recover

                from the error. The fields present depend on `code`. Additional

                keys may be added over time without a major-version bump.

                '
              additionalProperties: true
              properties:
                mx_conflict:
                  type: object
                  description: Present when `code == mx_conflict`.
                  required:
                  - provider_name
                  - suggested_subdomain
                  properties:
                    provider_name:
                      type: string
                      description: Human-readable name of the detected mailbox provider (e.g. "Google Workspace").
                    suggested_subdomain:
                      type: string
                      description: Subdomain to try instead (e.g. "mail" for `mail.example.com`).
                required_entitlements:
                  type: array
                  items:
                    type: string
                  description: Entitlements that would allow a denied send when no recipient-scope gate was granted.
                sent_email_id:
                  type: string
                  description: ID of the persisted sent-email attempt associated with the error.
                content_hash:
                  type: string
                  description: Content hash of the original request on idempotency cache-hit errors.
                client_idempotency_key:
                  type: string
                  description: Effective idempotency key associated with the original request.
            gates:
              type: array
              items:
                $ref: '#/components/schemas/GateDenial'
              description: Structured per-gate denial detail for recipient-scope send-mail failures.
            request_id:
              type: string
              description: Server-issued request identifier for support and tracing.
          required:
          - code
          - message
      required:
      - success
      - error
    GateDenial:
      type: object
      properties:
        name:
          type: string
          enum:
          - send_to_confirmed_domains
          - send_to_known_addresses
          description: Public recipient-scope gate name that denied the send.
        reason:
          type: string
          enum:
          - domain_not_confirmed
          - recipient_unauthenticated
          - recipient_not_known
          description: Stable machine-readable denial reason.
        message:
          type: string
          description: Human-readable explanation of the gate denial.
        subject:
          type: string
          description: Domain or address the gate evaluated.
        fix:
          $ref: '#/components/schemas/GateFix'
        docs_url:
          type: string
          description: Public docs URL with more context.
      required:
      - name
      - reason
      - message
      - subject
    GateFix:
      type: object
      properties:
        action:
          type: string
          enum:
          - confirm_domain
          - sender_must_fix_authentication
          - wait_for_inbound
          description: Suggested next action for the caller.
        subject:
          type: string
          description: Entity the action applies to.
      required:
      - action
      - subject
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key with `prim_` prefix or OAuth access token with `prim_oat_` prefix: `Authorization: Bearer <token>`. Access is governed by the caller''s organization role (`owner`, `admin`, or `member`): API keys always act at `member` level regardless of who created them, and OAuth access tokens act with the authorizing user''s current organization role, resolved per request. Every operation in this spec is available to organization members; billing and organization administration are owner/admin actions performed in the dashboard and are not part of this API.'
    DownloadToken:
      type: apiKey
      in: query
      name: token
      description: Signed download token provided in webhook payloads
