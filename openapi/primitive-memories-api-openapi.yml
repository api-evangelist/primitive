openapi: 3.2.0
info:
  title: Primitive Memories API
  version: 1.0.0
  description: Primitive is email infrastructure for AI agents.
  contact:
    name: Primitive
    url: https://primitive.dev
  license:
    name: Proprietary
    url: https://primitive.dev/terms
  x-stability-level: stable
  x-deprecation-policy: 'Breaking changes are announced at least 6 months in advance. Deprecated fields carry x-deprecated: true. The current stable version is v1.'
servers:
- url: https://api.primitive.dev/v1
  description: Canonical API host (PRIMITIVE_API_BASE_URL). Carries every public API operation.
tags:
- name: Memories
  description: 'Durable org-scoped or function-scoped JSON key-value storage for

    agents and functions. Keys are caller-defined. Function scope is

    always addressed by the function id UUID, not by function name.'
paths:
  /memories:
    put:
      operationId: setMemory
      summary: Set a memory
      description: Create or update a durable JSON memory under an org or function scope. Function-authenticated requests use their own Function id and cannot override it. If no explicit scope is provided for other credentials, `x-primitive-function-id` is used next, and other requests default to org scope. Function scope uses the function id UUID, not the function name.
      tags:
      - Memories
      security:
      - BearerAuth: []
      parameters:
      - name: x-primitive-function-id
        in: header
        required: false
        description: Optional function id UUID used as the default scope for non-function-authenticated requests when the body does not include `scope`. Ignored when `scope` is provided.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Caller-defined key, at most 512 UTF-8 bytes.
                value:
                  description: JSON value accepted by Primitive Memories. The server accepts strings, numbers, booleans, null, arrays, and objects, validates nested values, and rejects values that do not serialize as JSON.
                  oneOf:
                  - type: 'null'
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      $ref: '#/components/schemas/MemoryJsonValue'
                  - type: object
                    additionalProperties:
                      $ref: '#/components/schemas/MemoryJsonValue'
                scope:
                  description: Memory scope. `org` resolves to the authenticated organization. `function` requires the function id UUID in `id`; function names are not valid scope identifiers. Function-authenticated requests cannot override their own Function scope.
                  oneOf:
                  - type: object
                    additionalProperties: false
                    properties:
                      type:
                        type: string
                        enum:
                        - org
                    required:
                    - type
                  - type: object
                    additionalProperties: false
                    properties:
                      type:
                        type: string
                        enum:
                        - function
                      id:
                        type: string
                        format: uuid
                        description: Function id UUID.
                    required:
                    - type
                    - id
                ttl_seconds:
                  type: integer
                  minimum: 1
                  maximum: 31536000
                  description: Set or replace the TTL in seconds. Mutually exclusive with `expires_at` and `clear_ttl`.
                expires_at:
                  type: string
                  format: date-time
                  description: Set or replace the absolute expiration timestamp. Mutually exclusive with `ttl_seconds` and `clear_ttl`.
                clear_ttl:
                  type: boolean
                  description: Clear any existing TTL. Mutually exclusive with `ttl_seconds` and `expires_at`.
                if_absent:
                  type: boolean
                  description: Create only when the key is absent. Mutually exclusive with `if_version`.
                if_version:
                  type: string
                  pattern: ^[0-9]+$
                  description: Bigint counter serialized as a base-10 string.
              required:
              - key
              - value
      responses:
        '200':
          description: Existing memory updated.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: Memory record returned by get and set operations.
                      properties:
                        id:
                          type: string
                          format: uuid
                        key:
                          type: string
                          minLength: 1
                          maxLength: 512
                          description: Caller-defined key, at most 512 UTF-8 bytes.
                        scope:
                          type: object
                          additionalProperties: false
                          description: Resolved memory scope returned by the API.
                          properties:
                            type:
                              type: string
                              enum:
                              - org
                              - function
                            id:
                              type: string
                              format: uuid
                              description: Org id for org scope, function id for function scope.
                          required:
                          - type
                          - id
                        value:
                          description: JSON value accepted by Primitive Memories. The server accepts strings, numbers, booleans, null, arrays, and objects, validates nested values, and rejects values that do not serialize as JSON.
                          oneOf:
                          - type: 'null'
                          - type: string
                          - type: number
                          - type: boolean
                          - type: array
                            items:
                              $ref: '#/components/schemas/MemoryJsonValue'
                          - type: object
                            additionalProperties:
                              $ref: '#/components/schemas/MemoryJsonValue'
                        version:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        last_read_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Last successful get timestamp, or null before any get.
                        read_count:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        write_count:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        expires_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Expiration timestamp, or null for no TTL.
                        created_by:
                          type:
                          - string
                          - 'null'
                          description: Actor that created the memory, when available.
                        updated_by:
                          type:
                          - string
                          - 'null'
                          description: Actor that last updated the memory, when available.
                      required:
                      - id
                      - key
                      - scope
                      - value
                      - version
                      - created_at
                      - updated_at
                      - last_read_at
                      - read_count
                      - write_count
                      - expires_at
                      - created_by
                      - updated_by
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '201':
          description: Memory created.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: Memory record returned by get and set operations.
                      properties:
                        id:
                          type: string
                          format: uuid
                        key:
                          type: string
                          minLength: 1
                          maxLength: 512
                          description: Caller-defined key, at most 512 UTF-8 bytes.
                        scope:
                          type: object
                          additionalProperties: false
                          description: Resolved memory scope returned by the API.
                          properties:
                            type:
                              type: string
                              enum:
                              - org
                              - function
                            id:
                              type: string
                              format: uuid
                              description: Org id for org scope, function id for function scope.
                          required:
                          - type
                          - id
                        value:
                          description: JSON value accepted by Primitive Memories. The server accepts strings, numbers, booleans, null, arrays, and objects, validates nested values, and rejects values that do not serialize as JSON.
                          oneOf:
                          - type: 'null'
                          - type: string
                          - type: number
                          - type: boolean
                          - type: array
                            items:
                              $ref: '#/components/schemas/MemoryJsonValue'
                          - type: object
                            additionalProperties:
                              $ref: '#/components/schemas/MemoryJsonValue'
                        version:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        last_read_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Last successful get timestamp, or null before any get.
                        read_count:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        write_count:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        expires_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Expiration timestamp, or null for no TTL.
                        created_by:
                          type:
                          - string
                          - 'null'
                          description: Actor that created the memory, when available.
                        updated_by:
                          type:
                          - string
                          - 'null'
                          description: Actor that last updated the memory, when available.
                      required:
                      - id
                      - key
                      - scope
                      - value
                      - version
                      - created_at
                      - updated_at
                      - last_read_at
                      - read_count
                      - write_count
                      - expires_at
                      - created_by
                      - updated_by
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '402':
          $ref: '#/components/responses/PaymentRequired'
          description: Usage credits are exhausted or payment is required.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '409':
          $ref: '#/components/responses/Conflict'
          description: The request conflicts with the current state of the resource
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
    get:
      operationId: getMemory
      summary: Get a memory
      description: Fetch one active memory by key and scope. Omit scope parameters to use automatic scope resolution. Function-authenticated requests use their own Function id and cannot override it. Function scope uses a function id UUID in `scope_id`.
      tags:
      - Memories
      security:
      - BearerAuth: []
      parameters:
      - name: key
        in: query
        required: true
        description: Memory key. Must be at most 512 UTF-8 bytes.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: scope_type
        in: query
        required: false
        description: Explicit scope type. Omit to use automatic scope resolution. Pass `function` with `scope_id=<function-id>`, or `org` with no `scope_id`. Function-authenticated requests cannot override their automatic Function scope.
        schema:
          type: string
          enum:
          - org
          - function
      - name: scope_id
        in: query
        required: false
        description: Function id UUID when `scope_type=function`. Not valid with `scope_type=org`. Function-authenticated requests may only use their own Function id.
        schema:
          type: string
          format: uuid
      - name: x-primitive-function-id
        in: header
        required: false
        description: Optional function id UUID used as the default scope for non-function-authenticated requests when query scope parameters are omitted.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Memory record with value.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: Memory record returned by get and set operations.
                      properties:
                        id:
                          type: string
                          format: uuid
                        key:
                          type: string
                          minLength: 1
                          maxLength: 512
                          description: Caller-defined key, at most 512 UTF-8 bytes.
                        scope:
                          type: object
                          additionalProperties: false
                          description: Resolved memory scope returned by the API.
                          properties:
                            type:
                              type: string
                              enum:
                              - org
                              - function
                            id:
                              type: string
                              format: uuid
                              description: Org id for org scope, function id for function scope.
                          required:
                          - type
                          - id
                        value:
                          description: JSON value accepted by Primitive Memories. The server accepts strings, numbers, booleans, null, arrays, and objects, validates nested values, and rejects values that do not serialize as JSON.
                          oneOf:
                          - type: 'null'
                          - type: string
                          - type: number
                          - type: boolean
                          - type: array
                            items:
                              $ref: '#/components/schemas/MemoryJsonValue'
                          - type: object
                            additionalProperties:
                              $ref: '#/components/schemas/MemoryJsonValue'
                        version:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        last_read_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Last successful get timestamp, or null before any get.
                        read_count:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        write_count:
                          type: string
                          pattern: ^[0-9]+$
                          description: Bigint counter serialized as a base-10 string.
                        expires_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Expiration timestamp, or null for no TTL.
                        created_by:
                          type:
                          - string
                          - 'null'
                          description: Actor that created the memory, when available.
                        updated_by:
                          type:
                          - string
                          - 'null'
                          description: Actor that last updated the memory, when available.
                      required:
                      - id
                      - key
                      - scope
                      - value
                      - version
                      - created_at
                      - updated_at
                      - last_read_at
                      - read_count
                      - write_count
                      - expires_at
                      - created_by
                      - updated_by
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '402':
          $ref: '#/components/responses/PaymentRequired'
          description: Usage credits are exhausted or payment is required.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
    delete:
      operationId: deleteMemory
      summary: Delete a memory
      description: Delete one active memory by key and scope. Function-authenticated requests use their own Function id and cannot override it. Deletes are idempotent without `if_version`; a stale `if_version` returns `memory_conflict`.
      tags:
      - Memories
      security:
      - BearerAuth: []
      parameters:
      - name: key
        in: query
        required: true
        description: Memory key. Must be at most 512 UTF-8 bytes.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: scope_type
        in: query
        required: false
        description: Explicit scope type. Omit to use automatic scope resolution. Pass `function` with `scope_id=<function-id>`, or `org` with no `scope_id`. Function-authenticated requests cannot override their automatic Function scope.
        schema:
          type: string
          enum:
          - org
          - function
      - name: scope_id
        in: query
        required: false
        description: Function id UUID when `scope_type=function`. Not valid with `scope_type=org`. Function-authenticated requests may only use their own Function id.
        schema:
          type: string
          format: uuid
      - name: if_version
        in: query
        required: false
        description: Optional compare-and-delete version.
        schema:
          type: string
          pattern: ^[0-9]+$
          description: Bigint counter serialized as a base-10 string.
      - name: x-primitive-function-id
        in: header
        required: false
        description: Optional function id UUID used as the default scope for non-function-authenticated requests when query scope parameters are omitted.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Delete result.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        deleted:
                          type: boolean
                        key:
                          type: string
                        scope:
                          type: object
                          additionalProperties: false
                          description: Resolved memory scope returned by the API.
                          properties:
                            type:
                              type: string
                              enum:
                              - org
                              - function
                            id:
                              type: string
                              format: uuid
                              description: Org id for org scope, function id for function scope.
                          required:
                          - type
                          - id
                      required:
                      - deleted
                      - key
                      - scope
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '402':
          $ref: '#/components/responses/PaymentRequired'
          description: Usage credits are exhausted or payment is required.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '409':
          $ref: '#/components/responses/Conflict'
          description: The request conflicts with the current state of the resource
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
  /memories/search:
    get:
      operationId: searchMemories
      summary: Search memories
      description: List active memories in a scope by lexicographic key prefix. Results are ordered by key ascending. This is prefix search, not free-text search. Function-authenticated requests use their own Function id and cannot override it. Pass `include_value=false` to return metadata only.
      tags:
      - Memories
      security:
      - BearerAuth: []
      parameters:
      - name: prefix
        in: query
        required: false
        description: Key prefix to match. Empty string lists all active memories in the selected scope.
        schema:
          type: string
          maxLength: 512
          default: ''
      - name: cursor
        in: query
        required: false
        description: Key cursor from a previous response meta.cursor.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Number of results per page
      - name: include_value
        in: query
        required: false
        description: Pass `false` to omit the `value` field and return metadata only.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
      - name: updated_after
        in: query
        required: false
        description: Only include memories updated at or after this timestamp.
        schema:
          type: string
          format: date-time
      - name: updated_before
        in: query
        required: false
        description: Only include memories updated at or before this timestamp.
        schema:
          type: string
          format: date-time
      - name: scope_type
        in: query
        required: false
        description: Explicit scope type. Omit to use automatic scope resolution. Pass `function` with `scope_id=<function-id>`, or `org` with no `scope_id`. Function-authenticated requests cannot override their automatic Function scope.
        schema:
          type: string
          enum:
          - org
          - function
      - name: scope_id
        in: query
        required: false
        description: Function id UUID when `scope_type=function`. Not valid with `scope_type=org`. Function-authenticated requests may only use their own Function id.
        schema:
          type: string
          format: uuid
      - name: x-primitive-function-id
        in: header
        required: false
        description: Optional function id UUID used as the default scope for non-function-authenticated requests when query scope parameters are omitted.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated memory records.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                    meta:
                      type: object
                      properties:
                        total:
                          type: integer
                          description: Total number of matching records
                        limit:
                          type: integer
                          description: Page size used for this request
                        cursor:
                          type:
                          - string
                          - 'null'
                          description: Cursor for the next page, or null if no more results
                      required:
                      - total
                      - limit
                      - cursor
                  required:
                  - success
                  - data
                  - meta
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        description: Metadata for a Primitive memory. Search responses omit `value` when `include_value=false`.
                        properties:
                          id:
                            type: string
                            format: uuid
                          key:
                            type: string
                            minLength: 1
                            maxLength: 512
                            description: Caller-defined key, at most 512 UTF-8 bytes.
                          scope:
                            type: object
                            additionalProperties: false
                            description: Resolved memory scope returned by the API.
                            properties:
                              type:
                                type: string
                                enum:
                                - org
                                - function
                              id:
                                type: string
                                format: uuid
                                description: Org id for org scope, function id for function scope.
                            required:
                            - type
                            - id
                          value:
                            description: JSON value accepted by Primitive Memories. The server accepts strings, numbers, booleans, null, arrays, and objects, validates nested values, and rejects values that do not serialize as JSON.
                            oneOf:
                            - type: 'null'
                            - type: string
                            - type: number
                            - type: boolean
                            - type: array
                              items:
                                $ref: '#/components/schemas/MemoryJsonValue'
                            - type: object
                              additionalProperties:
                                $ref: '#/components/schemas/MemoryJsonValue'
                          version:
                            type: string
                            pattern: ^[0-9]+$
                            description: Bigint counter serialized as a base-10 string.
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          last_read_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: Last successful get timestamp, or null before any get.
                          read_count:
                            type: string
                            pattern: ^[0-9]+$
                            description: Bigint counter serialized as a base-10 string.
                          write_count:
                            type: string
                            pattern: ^[0-9]+$
                            description: Bigint counter serialized as a base-10 string.
                          expires_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: Expiration timestamp, or null for no TTL.
                          created_by:
                            type:
                            - string
                            - 'null'
                            description: Actor that created the memory, when available.
                          updated_by:
                            type:
                            - string
                            - 'null'
                            description: Actor that last updated the memory, when available.
                        required:
                        - id
                        - key
                        - scope
                        - version
                        - created_at
                        - updated_at
                        - last_read_at
                        - read_count
                        - write_count
                        - expires_at
                        - created_by
                        - updated_by
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '402':
          $ref: '#/components/responses/PaymentRequired'
          description: Usage credits are exhausted or payment is required.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '429':
          $ref: '#/components/responses/RateLimited'
          description: Rate limit exceeded
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: not_found
              message: Resource not found
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: unauthorized
              message: Invalid or missing API key
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: conflict
              message: settlement already in progress
    PaymentRequired:
      description: Usage credits are exhausted or payment is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller lacks permission for the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: forbidden
              message: Insufficient permissions
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: validation_error
              message: Invalid domain format
  schemas:
    MemoryJsonValue:
      description: JSON value accepted by Primitive Memories. The server accepts strings, numbers, booleans, null, arrays, and objects, validates nested values, and rejects values that do not serialize as JSON.
      oneOf:
      - type: 'null'
      - type: string
      - type: number
      - type: boolean
      - type: array
        items:
          $ref: '#/components/schemas/MemoryJsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/MemoryJsonValue'
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - not_found
              - validation_error
              - rate_limit_exceeded
              - internal_error
              - conflict
              - mx_conflict
              - outbound_disabled
              - cannot_send_from_domain
              - recipient_not_allowed
              - outbound_key_missing
              - outbound_unreachable
              - outbound_key_invalid
              - outbound_capacity_exhausted
              - outbound_response_malformed
              - outbound_relay_failed
              - discard_not_enabled
              - inbound_not_repliable
              - search_timeout
              - authorization_pending
              - slow_down
              - access_denied
              - expired_token
              - invalid_device_code
              - invalid_signup_code
              - invalid_signup_token
              - invalid_verification_code
              - email_delivery_failed
              - clerk_signup_failed
              - no_orgs_for_user
              - org_not_accessible
              - feature_disabled
              - memory_conflict
              - developer_usage_credit_exhausted
              - no_payout_address
              - ownership_proof_failed
              - payment_verification_failed
              - payment_declined
              - challenge_expired
              - settlement_failed
              - template_not_installable
              - scaffold_only
              - invalid_variables
              - unknown_secrets
              - missing_secrets
              - no_inbound_domain
              - domain_cannot_send
              - address_taken
              - route_cap_reached
              - name_exhausted
            message:
              type: string
            details:
              type: object
              description: 'Optional structured data that callers can inspect to recover

                from the error. The fields present depend on `code`. Additional

                keys may be added over time without a major-version bump.

                '
              additionalProperties: true
              properties:
                mx_conflict:
                  type: object
                  description: Present when `code == mx_conflict`.
                  required:
                  - provider_name
                  - suggested_subdomain
                  properties:
                    provider_name:
                      type: string
                      description: Human-readable name of the detected mailbox provider (e.g. "Google Workspace").
                    suggested_subdomain:
                      type: string
                      description: Subdomain to try instead (e.g. "mail" for `mail.example.com`).
                required_entitlements:
                  type: array
                  items:
                    type: string
                  description: Entitlements that would allow a denied send when no recipient-scope gate was granted.
                sent_email_id:
                  type: string
                  description: ID of the persisted sent-email attempt associated with the error.
                content_hash:
                  type: string
                  description: Content hash of the original request on idempotency cache-hit errors.
                client_idempotency_key:
                  type: string
                  description: Effective idempotency key associated with the original request.
            gates:
              type: array
              items:
                $ref: '#/components/schemas/GateDenial'
              description: Structured per-gate denial detail for recipient-scope send-mail failures.
            request_id:
              type: string
              description: Server-issued request identifier for support and tracing.
          required:
          - code
          - message
      required:
      - success
      - error
    GateDenial:
      type: object
      properties:
        name:
          type: string
          enum:
          - send_to_confirmed_domains
          - send_to_known_addresses
          description: Public recipient-scope gate name that denied the send.
        reason:
          type: string
          enum:
          - domain_not_confirmed
          - recipient_unauthenticated
          - recipient_not_known
          description: Stable machine-readable denial reason.
        message:
          type: string
          description: Human-readable explanation of the gate denial.
        subject:
          type: string
          description: Domain or address the gate evaluated.
        fix:
          $ref: '#/components/schemas/GateFix'
        docs_url:
          type: string
          description: Public docs URL with more context.
      required:
      - name
      - reason
      - message
      - subject
    GateFix:
      type: object
      properties:
        action:
          type: string
          enum:
          - confirm_domain
          - sender_must_fix_authentication
          - wait_for_inbound
          description: Suggested next action for the caller.
        subject:
          type: string
          description: Entity the action applies to.
      required:
      - action
      - subject
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key with `prim_` prefix or OAuth access token with `prim_oat_` prefix: `Authorization: Bearer <token>`. Access is governed by the caller''s organization role (`owner`, `admin`, or `member`): API keys always act at `member` level regardless of who created them, and OAuth access tokens act with the authorizing user''s current organization role, resolved per request. Every operation in this spec is available to organization members; billing and organization administration are owner/admin actions performed in the dashboard and are not part of this API.'
    DownloadToken:
      type: apiKey
      in: query
      name: token
      description: Signed download token provided in webhook payloads
