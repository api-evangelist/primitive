      responses:
        '200':
          description: List of recent wake dispatches
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: A recorded wake.dispatch interaction (audit row).
                        properties:
                          id:
                            type: string
                            format: uuid
                          wire_id:
                            type: string
                          role:
                            type: string
                          state:
                            type: string
                          outcome:
                            type:
                            - string
                            - 'null'
                          awaiting:
                            type:
                            - string
                            - 'null'
                          counterparty_address:
                            type: string
                          our_address:
                            type: string
                          step_count:
                            type: integer
                          created_at:
                            type: string
                            format: date-time
                          completed_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                        required:
                        - id
                        - wire_id
                        - role
                        - state
                        - counterparty_address
                        - our_address
                        - created_at
          headers:
            ratelimit-limit:
