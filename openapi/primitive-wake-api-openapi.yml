openapi: 3.2.0
info:
  title: Primitive Wake API
  version: 1.0.0
  description: Primitive is email infrastructure for AI agents.
  contact:
    name: Primitive
    url: https://primitive.dev
  license:
    name: Proprietary
    url: https://primitive.dev/terms
  x-stability-level: stable
  x-deprecation-policy: 'Breaking changes are announced at least 6 months in advance. Deprecated fields carry x-deprecated: true. The current stable version is v1.'
servers:
- url: https://api.primitive.dev/v1
  description: Canonical API host (PRIMITIVE_API_BASE_URL). Carries every public API operation.
tags:
- name: Wake
  description: 'Wake scheduling: schedule and send typed wake commands to your own

    functions over real DKIM-signed email on a cron cadence, and manage the

    per-target allowlist that authorizes which senders may wake a function.'
paths:
  /wake/schedules:
    get:
      operationId: listWakeSchedules
      summary: List wake schedules
      description: Returns the org's wake.dispatch schedules.
      tags:
      - Wake
      responses:
        '200':
          description: List of wake schedules
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: A cron schedule that sends a wake.dispatch command to a function.
                        properties:
                          id:
                            type: string
                            format: uuid
                          from_address:
                            type:
                            - string
                            - 'null'
                            description: The sending identity the wake is signed as.
                          target_address:
                            type: string
                            description: The function address the wake is delivered to.
                          command:
                            type: string
                          args:
                            type: object
                            additionalProperties: true
                          cron_expr:
                            type: string
                            description: 5-field cron expression.
                          timezone:
                            type: string
                            description: IANA timezone the cron is evaluated in.
                          next_run_at:
                            type: string
                            format: date-time
                          last_run_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          enabled:
                            type: boolean
                          note:
                            type:
                            - string
                            - 'null'
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                        required:
                        - id
                        - target_address
                        - command
                        - cron_expr
                        - timezone
                        - next_run_at
                        - enabled
                        - created_at
                        - updated_at
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
    post:
      operationId: createWakeSchedule
      summary: Create a wake schedule
      description: 'Create a cron schedule that sends a wake.dispatch command to one of your

        own function addresses. `from` and `to` must differ (no self-dispatch);

        the cron expression and IANA timezone are validated and the first fire

        time is computed without firing immediately.'
      tags:
      - Wake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from_address:
                  type: string
                  description: Sending identity (must be a domain the org can sign).
                target_address:
                  type: string
                  description: Your function address (must differ from from_address).
                command:
                  type: string
                  minLength: 1
                  maxLength: 200
                args:
                  type: object
                  additionalProperties: true
                  description: Optional JSON object passed through to the woken function.
                cron_expr:
                  type: string
                  minLength: 1
                  maxLength: 120
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  default: UTC
                note:
                  type: string
                  maxLength: 2000
              required:
              - from_address
              - target_address
              - command
              - cron_expr
      responses:
        '201':
          description: Wake schedule created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A cron schedule that sends a wake.dispatch command to a function.
                      properties:
                        id:
                          type: string
                          format: uuid
                        from_address:
                          type:
                          - string
                          - 'null'
                          description: The sending identity the wake is signed as.
                        target_address:
                          type: string
                          description: The function address the wake is delivered to.
                        command:
                          type: string
                        args:
                          type: object
                          additionalProperties: true
                        cron_expr:
                          type: string
                          description: 5-field cron expression.
                        timezone:
                          type: string
                          description: IANA timezone the cron is evaluated in.
                        next_run_at:
                          type: string
                          format: date-time
                        last_run_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        enabled:
                          type: boolean
                        note:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - target_address
                      - command
                      - cron_expr
                      - timezone
                      - next_run_at
                      - enabled
                      - created_at
                      - updated_at
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /wake/schedules/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    get:
      operationId: getWakeSchedule
      summary: Get a wake schedule
      tags:
      - Wake
      responses:
        '200':
          description: The wake schedule
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A cron schedule that sends a wake.dispatch command to a function.
                      properties:
                        id:
                          type: string
                          format: uuid
                        from_address:
                          type:
                          - string
                          - 'null'
                          description: The sending identity the wake is signed as.
                        target_address:
                          type: string
                          description: The function address the wake is delivered to.
                        command:
                          type: string
                        args:
                          type: object
                          additionalProperties: true
                        cron_expr:
                          type: string
                          description: 5-field cron expression.
                        timezone:
                          type: string
                          description: IANA timezone the cron is evaluated in.
                        next_run_at:
                          type: string
                          format: date-time
                        last_run_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        enabled:
                          type: boolean
                        note:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - target_address
                      - command
                      - cron_expr
                      - timezone
                      - next_run_at
                      - enabled
                      - created_at
                      - updated_at
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
    patch:
      operationId: updateWakeSchedule
      summary: Update a wake schedule
      description: 'Update a schedule''s command, args, cadence, addresses, note, or enabled

        state. Changing the cadence (or re-enabling) recomputes the next fire time.'
      tags:
      - Wake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                command:
                  type: string
                  minLength: 1
                  maxLength: 200
                args:
                  type: object
                  additionalProperties: true
                cron_expr:
                  type: string
                  minLength: 1
                  maxLength: 120
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                from_address:
                  type: string
                target_address:
                  type: string
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 2000
      responses:
        '200':
          description: Updated wake schedule
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A cron schedule that sends a wake.dispatch command to a function.
                      properties:
                        id:
                          type: string
                          format: uuid
                        from_address:
                          type:
                          - string
                          - 'null'
                          description: The sending identity the wake is signed as.
                        target_address:
                          type: string
                          description: The function address the wake is delivered to.
                        command:
                          type: string
                        args:
                          type: object
                          additionalProperties: true
                        cron_expr:
                          type: string
                          description: 5-field cron expression.
                        timezone:
                          type: string
                          description: IANA timezone the cron is evaluated in.
                        next_run_at:
                          type: string
                          format: date-time
                        last_run_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        enabled:
                          type: boolean
                        note:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - target_address
                      - command
                      - cron_expr
                      - timezone
                      - next_run_at
                      - enabled
                      - created_at
                      - updated_at
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
    delete:
      operationId: deleteWakeSchedule
      summary: Delete a wake schedule
      tags:
      - Wake
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: boolean
                          const: true
                      required:
                      - deleted
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
  /wake/schedules/{id}/run:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    post:
      operationId: runWakeSchedule
      summary: Run a wake schedule now
      description: 'Fire the schedule immediately, sending one wake.dispatch via the same

        signed-send path as a scheduled fire. Does not change the schedule''s next

        fire time.'
      tags:
      - Wake
      responses:
        '200':
          description: The wake interaction that was emitted
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /wake/authorizations:
    get:
      operationId: listWakeAuthorizations
      summary: List wake authorizations
      description: 'Returns the per-target allowlist grants that authorize which senders may

        wake a function. Optionally filter by the target endpoint.'
      tags:
      - Wake
      parameters:
      - name: recipient_endpoint_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only return grants for this target endpoint
      responses:
        '200':
          description: List of wake authorizations
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: A per-target allowlist grant authorizing a sender to wake a function.
                        properties:
                          id:
                            type: string
                            format: uuid
                          recipient_endpoint_id:
                            type: string
                            format: uuid
                          allowed_sender_domain:
                            type: string
                          allowed_sender_address:
                            type:
                            - string
                            - 'null'
                          allowed_commands:
                            type:
                            - array
                            - 'null'
                            items:
                              type: string
                          enabled:
                            type: boolean
                          note:
                            type:
                            - string
                            - 'null'
                          created_at:
                            type: string
                            format: date-time
                        required:
                        - id
                        - recipient_endpoint_id
                        - allowed_sender_domain
                        - enabled
                        - created_at
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
    post:
      operationId: createWakeAuthorization
      summary: Create a wake authorization
      description: 'Grant a sender domain (and optionally a specific address and command set)

        permission to wake a target function. The domain must be fully-qualified.'
      tags:
      - Wake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recipient_endpoint_id:
                  type: string
                  format: uuid
                allowed_sender_domain:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: Fully-qualified sender domain (at least two labels).
                allowed_sender_address:
                  type:
                  - string
                  - 'null'
                  description: Optional specific sender address to pin the grant to.
                allowed_commands:
                  type:
                  - array
                  - 'null'
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                  description: Optional command allowlist; null = any command.
                note:
                  type: string
                  maxLength: 2000
              required:
              - recipient_endpoint_id
              - allowed_sender_domain
      responses:
        '201':
          description: Wake authorization created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A per-target allowlist grant authorizing a sender to wake a function.
                      properties:
                        id:
                          type: string
                          format: uuid
                        recipient_endpoint_id:
                          type: string
                          format: uuid
                        allowed_sender_domain:
                          type: string
                        allowed_sender_address:
                          type:
                          - string
                          - 'null'
                        allowed_commands:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                        enabled:
                          type: boolean
                        note:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - recipient_endpoint_id
                      - allowed_sender_domain
                      - enabled
                      - created_at
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '409':
          $ref: '#/components/responses/Conflict'
          description: The request conflicts with the current state of the resource
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /wake/authorizations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    patch:
      operationId: updateWakeAuthorization
      summary: Update a wake authorization
      description: Toggle a wake authorization's enabled state.
      tags:
      - Wake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
      responses:
        '200':
          description: Updated wake authorization
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A per-target allowlist grant authorizing a sender to wake a function.
                      properties:
                        id:
                          type: string
                          format: uuid
                        recipient_endpoint_id:
                          type: string
                          format: uuid
                        allowed_sender_domain:
                          type: string
                        allowed_sender_address:
                          type:
                          - string
                          - 'null'
                        allowed_commands:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                        enabled:
                          type: boolean
                        note:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - recipient_endpoint_id
                      - allowed_sender_domain
                      - enabled
                      - created_at
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
    delete:
      operationId: deleteWakeAuthorization
      summary: Delete a wake authorization
      tags:
      - Wake
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: boolean
                          const: true
                      required:
                      - deleted
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
  /wake/dispatches:
