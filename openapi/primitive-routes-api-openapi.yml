openapi: 3.2.0
info:
  title: Primitive Routes API
  version: 1.0.0
  description: Primitive is email infrastructure for AI agents.
  contact:
    name: Primitive
    url: https://primitive.dev
  license:
    name: Proprietary
    url: https://primitive.dev/terms
  x-stability-level: stable
  x-deprecation-policy: 'Breaking changes are announced at least 6 months in advance. Deprecated fields carry x-deprecated: true. The current stable version is v1.'
servers:
- url: https://api.primitive.dev/v1
  description: Canonical API host (PRIMITIVE_API_BASE_URL). Carries every public API operation.
tags:
- name: Routes
  description: 'Recipient routing: route inbound mail to a single destination per recipient

    address. Rules bind an address pattern (exact or wildcard) to an endpoint;

    `function_id` routes an address to a function, minting its route-target

    endpoint.'
paths:
  /routes:
    get:
      operationId: listRoutes
      summary: List recipient routes
      description: 'Returns the org''s recipient routing rules in evaluation order. Each rule

        binds a recipient address pattern to one endpoint; inbound mail resolves

        to a single destination at delivery time.'
      tags:
      - Routes
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: A recipient routing rule binding an address pattern to one endpoint.
                        properties:
                          id:
                            type: string
                            format: uuid
                          org_id:
                            type: string
                            format: uuid
                          domain_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: Domain the route is scoped to; null = org-wide.
                          match_type:
                            type: string
                            enum:
                            - exact
                            - wildcard
                            - regex
                          pattern:
                            type: string
                            description: The recipient address pattern (an exact address or a wildcard).
                          pattern_norm:
                            type:
                            - string
                            - 'null'
                            description: Normalized pattern used for matching.
                          endpoint_id:
                            type: string
                            format: uuid
                            description: The endpoint inbound mail matching this rule is delivered to.
                          priority:
                            type: integer
                            description: Evaluation order within a scope; lower is checked first.
                          enabled:
                            type: boolean
                          match_count:
                            type: string
                            description: How many emails have matched this rule (a bigint, returned as a string).
                          last_matched_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          created_at:
                            type: string
                            format: date-time
                        required:
                        - id
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
    post:
      operationId: createRoute
      summary: Create a recipient route
      description: 'Binds a recipient pattern to a destination. Provide exactly one of

        `endpoint_id` (an existing endpoint) or `function_id`. With `function_id`,

        a dedicated route-target endpoint is minted for that function in the same

        transaction, enabling per-address function routing (e.g.

        `alice@acme.com -> functionA`).'
      tags:
      - Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: 'Provide exactly one of `endpoint_id` or `function_id`. With `function_id`,

                a route-target endpoint is minted for that function and the route is bound

                to it in one transaction.

                '
              properties:
                match_type:
                  type: string
                  enum:
                  - exact
                  - wildcard
                  - regex
                pattern:
                  type: string
                  minLength: 1
                  maxLength: 512
                endpoint_id:
                  type: string
                  format: uuid
                  description: An existing endpoint to route to. Mutually exclusive with function_id.
                function_id:
                  type: string
                  format: uuid
                  description: Route to this function, minting its route-target endpoint if needed. Mutually exclusive with endpoint_id.
                domain_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Scope the route to a domain; defaults to the pattern's domain.
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                enabled:
                  type: boolean
              required:
              - match_type
              - pattern
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A recipient routing rule binding an address pattern to one endpoint.
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        domain_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Domain the route is scoped to; null = org-wide.
                        match_type:
                          type: string
                          enum:
                          - exact
                          - wildcard
                          - regex
                        pattern:
                          type: string
                          description: The recipient address pattern (an exact address or a wildcard).
                        pattern_norm:
                          type:
                          - string
                          - 'null'
                          description: Normalized pattern used for matching.
                        endpoint_id:
                          type: string
                          format: uuid
                          description: The endpoint inbound mail matching this rule is delivered to.
                        priority:
                          type: integer
                          description: Evaluation order within a scope; lower is checked first.
                        enabled:
                          type: boolean
                        match_count:
                          type: string
                          description: How many emails have matched this rule (a bigint, returned as a string).
                        last_matched_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        created_at:
                          type: string
                          format: date-time
                      required:
                      - id
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '409':
          $ref: '#/components/responses/Conflict'
          description: The request conflicts with the current state of the resource
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /routes/reorder:
    post:
      operationId: reorderRoutes
      summary: Reorder recipient routes
      description: Update the priority of one or more routes in a single call.
      tags:
      - Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      priority:
                        type: integer
                        minimum: 0
                        maximum: 1000000
                    required:
                    - id
                    - priority
              required:
              - updates
      responses:
        '200':
          description: Updated route list
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: A recipient routing rule binding an address pattern to one endpoint.
                        properties:
                          id:
                            type: string
                            format: uuid
                          org_id:
                            type: string
                            format: uuid
                          domain_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: Domain the route is scoped to; null = org-wide.
                          match_type:
                            type: string
                            enum:
                            - exact
                            - wildcard
                            - regex
                          pattern:
                            type: string
                            description: The recipient address pattern (an exact address or a wildcard).
                          pattern_norm:
                            type:
                            - string
                            - 'null'
                            description: Normalized pattern used for matching.
                          endpoint_id:
                            type: string
                            format: uuid
                            description: The endpoint inbound mail matching this rule is delivered to.
                          priority:
                            type: integer
                            description: Evaluation order within a scope; lower is checked first.
                          enabled:
                            type: boolean
                          match_count:
                            type: string
                            description: How many emails have matched this rule (a bigint, returned as a string).
                          last_matched_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          created_at:
                            type: string
                            format: date-time
                        required:
                        - id
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /routes/simulate:
    post:
      operationId: simulateRoute
      summary: Simulate routing for a recipient
      description: 'Resolves where an inbound email to `recipient` would be delivered, with a

        trace of every rule evaluated and why. Read-only; creates nothing.'
      tags:
      - Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recipient:
                  type: string
                  minLength: 1
                  maxLength: 320
                event_type:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Event type to model; defaults to email.received.
              required:
              - recipient
      responses:
        '200':
          description: Routing decision
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: Where an inbound email to the recipient would be delivered, and why.
                      properties:
                        outcome:
                          type: string
                          enum:
                          - matched
                          - defaulted
                          - none
                        recipient:
                          type: string
                        endpoint_id:
                          type:
                          - string
                          - 'null'
                        matched_route_id:
                          type:
                          - string
                          - 'null'
                        matched_tier:
                          type:
                          - string
                          - 'null'
                          enum:
                          - exact
                          - wildcard
                          - regex
                          - null
                        matched_pattern:
                          type:
                          - string
                          - 'null'
                        default_scope:
                          type:
                          - string
                          - 'null'
                          enum:
                          - domain
                          - org
                          - null
                        evaluated:
                          type: array
                          items:
                            type: object
                            properties:
                              route_id:
                                type: string
                              tier:
                                type: string
                                enum:
                                - exact
                                - wildcard
                                - regex
                              pattern:
                                type: string
                              result:
                                type: string
                                enum:
                                - hit
                                - miss
                                - skipped
                                - error
                              reason:
                                type: string
                            required:
                            - route_id
                            - tier
                            - pattern
                            - result
                        truncated:
                          type: boolean
                      required:
                      - outcome
                      - recipient
                      - endpoint_id
                      - matched_route_id
                      - matched_tier
                      - matched_pattern
                      - default_scope
                      - evaluated
                      - truncated
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied idempotency key. Retrying a request with the same key returns the original result instead of performing the action a second time; if omitted the server derives one from the canonical payload hash. Safe to retry network failures without duplicating side effects.
        schema:
          type: string
          minLength: 1
          maxLength: 255
  /routes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
    patch:
      operationId: updateRoute
      summary: Update a recipient route
      tags:
      - Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                match_type:
                  type: string
                  enum:
                  - exact
                  - wildcard
                  - regex
                pattern:
                  type: string
                  minLength: 1
                  maxLength: 512
                endpoint_id:
                  type: string
                  format: uuid
                domain_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated route
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      description: A recipient routing rule binding an address pattern to one endpoint.
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        domain_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Domain the route is scoped to; null = org-wide.
                        match_type:
                          type: string
                          enum:
                          - exact
                          - wildcard
                          - regex
                        pattern:
                          type: string
                          description: The recipient address pattern (an exact address or a wildcard).
                        pattern_norm:
                          type:
                          - string
                          - 'null'
                          description: Normalized pattern used for matching.
                        endpoint_id:
                          type: string
                          format: uuid
                          description: The endpoint inbound mail matching this rule is delivered to.
                        priority:
                          type: integer
                          description: Evaluation order within a scope; lower is checked first.
                        enabled:
                          type: boolean
                        match_count:
                          type: string
                          description: How many emails have matched this rule (a bigint, returned as a string).
                        last_matched_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        created_at:
                          type: string
                          format: date-time
                      required:
                      - id
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid request parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Authenticated caller lacks permission for the operation
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
        '409':
          $ref: '#/components/responses/Conflict'
          description: The request conflicts with the current state of the resource
      security:
      - BearerAuth: []
    delete:
      operationId: deleteRoute
      summary: Delete a recipient route
      tags:
      - Routes
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      const: true
                  required:
                  - success
                  - data
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: boolean
                          const: true
                      required:
                      - deleted
          headers:
            ratelimit-limit:
              description: Maximum number of requests allowed in the current window.
              schema:
                type: integer
                minimum: 1
                example: 120
            ratelimit-remaining:
              description: Remaining requests in the current window.
              schema:
                type: integer
                minimum: 0
                example: 118
            ratelimit-reset:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
                example: 1700000060
            ratelimit-policy:
              description: Rate-limit policy in `limit;w=seconds` format, e.g. `120;w=60`.
              schema:
                type: string
                example: 120;w=60
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Invalid or missing API key
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
      - BearerAuth: []
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: not_found
              message: Resource not found
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: unauthorized
              message: Invalid or missing API key
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: conflict
              message: settlement already in progress
    Forbidden:
      description: Authenticated caller lacks permission for the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: forbidden
              message: Insufficient permissions
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: validation_error
              message: Invalid domain format
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - not_found
              - validation_error
              - rate_limit_exceeded
              - internal_error
              - conflict
              - mx_conflict
              - outbound_disabled
              - cannot_send_from_domain
              - recipient_not_allowed
              - outbound_key_missing
              - outbound_unreachable
              - outbound_key_invalid
              - outbound_capacity_exhausted
              - outbound_response_malformed
              - outbound_relay_failed
              - discard_not_enabled
              - inbound_not_repliable
              - search_timeout
              - authorization_pending
              - slow_down
              - access_denied
              - expired_token
              - invalid_device_code
              - invalid_signup_code
              - invalid_signup_token
              - invalid_verification_code
              - email_delivery_failed
              - clerk_signup_failed
              - no_orgs_for_user
              - org_not_accessible
              - feature_disabled
              - memory_conflict
              - developer_usage_credit_exhausted
              - no_payout_address
              - ownership_proof_failed
              - payment_verification_failed
              - payment_declined
              - challenge_expired
              - settlement_failed
              - template_not_installable
              - scaffold_only
              - invalid_variables
              - unknown_secrets
              - missing_secrets
              - no_inbound_domain
              - domain_cannot_send
              - address_taken
              - route_cap_reached
              - name_exhausted
            message:
              type: string
            details:
              type: object
              description: 'Optional structured data that callers can inspect to recover

                from the error. The fields present depend on `code`. Additional

                keys may be added over time without a major-version bump.

                '
              additionalProperties: true
              properties:
                mx_conflict:
                  type: object
                  description: Present when `code == mx_conflict`.
                  required:
                  - provider_name
                  - suggested_subdomain
                  properties:
                    provider_name:
                      type: string
                      description: Human-readable name of the detected mailbox provider (e.g. "Google Workspace").
                    suggested_subdomain:
                      type: string
                      description: Subdomain to try instead (e.g. "mail" for `mail.example.com`).
                required_entitlements:
                  type: array
                  items:
                    type: string
                  description: Entitlements that would allow a denied send when no recipient-scope gate was granted.
                sent_email_id:
                  type: string
                  description: ID of the persisted sent-email attempt associated with the error.
                content_hash:
                  type: string
                  description: Content hash of the original request on idempotency cache-hit errors.
                client_idempotency_key:
                  type: string
                  description: Effective idempotency key associated with the original request.
            gates:
              type: array
              items:
                $ref: '#/components/schemas/GateDenial'
              description: Structured per-gate denial detail for recipient-scope send-mail failures.
            request_id:
              type: string
              description: Server-issued request identifier for support and tracing.
          required:
          - code
          - message
      required:
      - success
      - error
    GateDenial:
      type: object
      properties:
        name:
          type: string
          enum:
          - send_to_confirmed_domains
          - send_to_known_addresses
          description: Public recipient-scope gate name that denied the send.
        reason:
          type: string
          enum:
          - domain_not_confirmed
          - recipient_unauthenticated
          - recipient_not_known
          description: Stable machine-readable denial reason.
        message:
          type: string
          description: Human-readable explanation of the gate denial.
        subject:
          type: string
          description: Domain or address the gate evaluated.
        fix:
          $ref: '#/components/schemas/GateFix'
        docs_url:
          type: string
          description: Public docs URL with more context.
      required:
      - name
      - reason
      - message
      - subject
    GateFix:
      type: object
      properties:
